name: Testing en JUnit

on:
  push:
    branches: ["feature/**","bugfix/**","hotfix/**"] #Pruebas de regresión cuando agrego nueva característica o corrijo un error
  pull_request:
    branches: ["develop","release/**","main"]

jobs:
  testing:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v7 #Descarga el código del repo al runner de ubuntu

    - name: Configurar Java y Maven en Ubuntu
      uses: actions/setup-java@v6
      with:
          distribution: 'temurin'
          java-version: 25
          cache: maven

    - name: Verificar versiones
      run: |
        java --version
        mvn -version